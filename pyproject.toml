[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "genshin-overlay"
version = "0.1.0"
description = "Screen-only Genshin Impact HUD reader and overlay"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "dxcam>=0.3",
    "Pillow>=10",
    "PySide6>=6.8",
]

[project.scripts]
genshin-overlay = "genshin_overlay.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
genshin_overlay = ["assets/digits/*.png"]
