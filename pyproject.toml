[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "genshin-overlay"
version = "1.0.0"
description = "Screen-only Genshin Impact HUD reader and overlay"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "dxcam>=0.3",
    "Pillow>=10",
    "PySide6>=6.8",
]

[project.scripts]
genshin-overlay = "genshin_overlay.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
genshin_overlay = ["assets/digits/*.png"]

[project.optional-dependencies]
dev = [
    "mypy>=1.0",
]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
ignore_missing_imports = true
show_error_codes = true
